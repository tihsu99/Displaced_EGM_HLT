[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "displaced-egm-hlt"
version = "0.1.0"
description = "Student workflow for displaced EGM HLT identification studies"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.24", "pandas>=2", "pyarrow>=14", "uproot>=5", "awkward>=2", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
egm = "egm.cli:main"

[tool.setuptools]
packages = ["egm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
