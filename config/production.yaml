# Fill the null fields from DAS and a validated CMSSW menu, then enable samples.
# Relative paths resolve against this YAML. No Run-3 scouting products are used.
campaign: phase2_barrel_v1
storage:
  eos: null  # root://eosuser.cern.ch//eos/user/u/username/displaced_egm
  redirector: root://cms-xrd-global.cern.ch/
cmssw:
  # Build once with cmsrel/cmsenv/scram b, then reuse this area locally and on Condor.
  runtime: prebuilt  # Set scratch only when a per-worker build is explicitly wanted.
  base: null  # Absolute CMSSW area, visible at the same path on lxplus and workers.
  release: null  # Pin the release compatible with the sample and the HLT menu.
  scram_arch: null
  cmsset_default: /cvmfs/cms.cern.ch/cmsset_default.sh
  build_jobs: 2  # Used only by runtime: scratch.
  # existing: consume persisted HLT candidates/maps; rerun: run the pset below first.
  mode: existing
  replay_pset: null
  # A replay pset must accept inputFiles, outputFile, maxEvents via VarParsing.
  # Custom dependencies can live in the prebuilt area; keep that area unchanged.
  # Scratch mode requires release-provided dependencies or a self-contained pset.
  provenance:
    global_tag: null
    geometry: null
    era: null
    menu: null
    input_campaign: Phase2Spring24_PU200
ntuplizer:
  # Inspect edmDumpEventContent; these are intentionally not guessed labels.
  candidates: null  # reco::RecoEcalCandidateCollection, before the ID cuts
  gen_particles: genParticles
  generator: generator
  pdg_ids: [22, 11]
  llp_pdg_ids: [1000022]
  invalid_map_values: [-999.0, -9999.0]
  # No ID, pT, eta, impact-parameter, pixel-hit, or prompt filtering here.
  maps:
    # Each product must be a reco::RecoEcalCandidateIsolationMap keyed to candidates.
    sigma_ieta_ieta: null
    s_major: null
    s_minor: null
    hoe: null
    ecal_iso: null
    hcal_iso: null
    r9: null
    track_iso: null
production:
  files_per_job: 1
  max_events: -1
  local_test_events: 100
  stage_inputs: true
  stageout_attempts: 3
condor:
  proxy: ${X509_USER_PROXY}
  flavour: workday
  cpus: 2
  memory_mb: 4000
  disk_mb: 20000
  requirements: '(OpSysAndVer == "AlmaLinux9") && (Arch == "X86_64")'
samples:
  gmsb:
    enabled: true
    description: GMSB_L-100TeV_Ctau-1000cm_TuneCP5_14TeV-pythia8
    role: signal
    truth: llp
    # Supplied dataset name; its file content and release compatibility still need testing.
    das: /GMSB_L-100TeV_Ctau-1000cm_TuneCP5_14TeV-pythia8/Phase2Spring24DIGIRECOMiniAOD-PU200_Trk1GeV_140X_mcRun4_realistic_v4-v1/GEN-SIM-DIGI-RAW-MINIAOD
    files: []  # Explicit /store/... LFNs or root:// URLs can replace DAS.
    tier: GEN-SIM-DIGI-RAW-MINIAOD
    input_global_tag: 140X_mcRun4_realistic_v4
    instance: prod/global
  hgg:
    enabled: false
    description: GluGluHToGG_M-125_TuneCP5_14TeV-powheg-pythia8
    role: signal
    truth: prompt
    das: null
    files: []
    tier: null
    instance: prod/global
  qcd_inclusive:
    enabled: false
    description: QCD_Pt-15To3000_TuneCP5_Flat_14TeV-pythia8
    role: background
    truth: all
    das: null
    files: []
    tier: null
    instance: prod/global
  qcd_em:
    enabled: false
    description: QCD_Pt-15To3000_EMEnriched_TuneCP5_14TeV-pythia8
    role: background
    truth: all
    das: null
    files: []
    tier: null
    instance: prod/global
  qcd_bc:
    enabled: false
    description: QCD_Pt-30To80_bcToE_TuneCP5_14TeV-pythia8
    role: background
    truth: all
    das: null
    files: []
    tier: null
    instance: prod/global
