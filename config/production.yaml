# Phase2Spring24 profile; full sample processing still requires a local test.
# CMSSW 20_X breaks legacy non-RAW schemas; use the pre-transition 17_X release.
# Source definitions are listed in docs/cmssw.md.
# Export EGM_CMSSW_BASE, EGM_EOS and X509_USER_PROXY before preparing jobs.
campaign: phase2_barrel_1700_ntuple_v2
storage:
  eos: ${EGM_EOS}
  redirector: root://cms-xrd-global.cern.ch/
cmssw:
  # Build once with cmsrel/cmsenv/scram b, then reuse this area locally and on Condor.
  runtime: prebuilt  # Set scratch only when a per-worker build is explicitly wanted.
  base: ${EGM_CMSSW_BASE}
  release: CMSSW_17_0_0
  scram_arch: el9_amd64_gcc13
  cmsset_default: /cvmfs/cms.cern.ch/cmsset_default.sh
  build_jobs: 2  # Used only by runtime: scratch.
  # existing: consume persisted HLT candidates/maps; rerun: run the pset below first.
  mode: rerun
  replay_pset: ../Ntuplizer/test/replay_cfg.py
  # A replay pset must accept inputFiles, outputFile, maxEvents via VarParsing.
  # Custom dependencies can live in the prebuilt area; keep that area unchanged.
  # Scratch mode requires release-provided dependencies or a self-contained pset.
  provenance:
    global_tag: auto:phase2_realistic_T35
    geometry: ExtendedRun4D110
    era: Phase2C17I13M9
    menu: 75e33
    input_campaign: Phase2Spring24_PU200
  replay:
    process: HLTX
    steps: [L1, L1TrackTrigger, L1P2GT, 'HLT:75e33']
    threads: 1
    customise:
      - SLHCUpgradeSimulations/Configuration/aging.customise_aging_1000
      - L1Trigger/Configuration/customisePhase2TTOn110.customisePhase2TTOn110
    load:
      - HLTrigger.Configuration.HLT_75e33.modules.hltEgammaR9Unseeded_cfi
      - HLTrigger.Configuration.HLT_75e33.modules.hltEgammaHollowTrackIsoUnseeded_cfi
    # Additional unconditional path; keep the generated L1/HLT menu schedule.
    # This supplies all ID inputs even when a trigger path rejects an event.
    sequence:
      - HLTBeamSpotSequence
      - HLTDoFullUnpackingEgammaEcalSequence
      - HLTEGammaDoLocalHcalSequence
      - HLTPFClusteringForEgammaUnseededSequence
      - HLTHgcalTiclPFClusteringForEgammaUnseededSequence
      - hltEgammaCandidatesUnseeded
      - hltEgammaClusterShapeUnseeded
      - hltEgammaR9Unseeded
      - HLTFastJetForEgammaSequence
      - hltEgammaHoverEUnseeded
      - hltEgammaEcalPFClusterIsoUnseeded
      - HLTPFHcalClusteringForEgammaSequence
      - hltEgammaHcalPFClusterIsoUnseeded
      - HLTTrackingSequence
      - hltEgammaHollowTrackIsoUnseeded
    parameters:
      # The menu defaults to 10 GeV; retain candidates below the 5 GeV analysis cut.
      hltParticleFlowSuperClusterECALUnseeded.thresh_SCEt: 0.0
    input_commands:
      - keep *
      - drop *_hlt*_*_*
      - drop l1tPFJets_*_*_*
      - drop l1tTrackerMuons_l1tTkMuonsGmt*_*_HLT
    extra:
      module: hltEgammaHLTExtra
      load: RecoEgamma.EgammaHLTProducers.hltEgammaHLTExtra_cfi
      instance: Unseeded
      pixel_seeds: hltEgammaElectronPixelSeedsUnseeded::HLTX
      gsf_tracks: hltEgammaGsfTracksUnseeded::HLTX
ntuplizer:
  objects: hltEgammaHLTExtra:Unseeded:HLTX
  candidates: hltEgammaCandidatesUnseeded::HLTX
  gen_particles: genParticles
  generator: generator
  pdg_ids: [22, 11]
  llp_pdg_ids: [1000022]
  invalid_map_values: [-999.0, -9999.0]
  # The HLT HoverE map contains H in GeV, not the dimensionless ratio.
  divide_by_candidate_energy: [hoe]
  # Kinematic acceptance only; no ID, pixel match or prompt-track requirement.
  selection: {pt_min: 5.0, abs_eta_max: 1.44}
  matching:
    pdg_id: 22
    direction: ecal_barrel
    max_dr: 0.1
    ecal_radius_cm: 129.0
    ecal_half_length_cm: 300.0
  maps:
    # Extra copies these maps into vars named moduleLabel[_instance].
    sigma_ieta_ieta: hltEgammaClusterShapeUnseeded:sigmaIEtaIEta5x5:HLTX
    s_major: hltEgammaClusterShapeUnseeded:sMajor:HLTX
    s_minor: hltEgammaClusterShapeUnseeded:sMinor:HLTX
    hoe: hltEgammaHoverEUnseeded::HLTX
    ecal_iso: hltEgammaEcalPFClusterIsoUnseeded::HLTX
    hcal_iso: hltEgammaHcalPFClusterIsoUnseeded::HLTX
    r9: hltEgammaR9Unseeded::HLTX
    track_iso: hltEgammaHollowTrackIsoUnseeded::HLTX
production:
  files_per_job: 1
  max_events: -1
  local_test_events: 100
  stage_inputs: false  # Read root:// directly; true copies each complete input to scratch.
  stageout_attempts: 3
condor:
  proxy: ${X509_USER_PROXY}
  flavour: workday
  cpus: 2
  memory_mb: 8000
  disk_mb: 20000
  requirements: '(OpSysAndVer == "AlmaLinux9") && (Arch == "X86_64")'
samples:
  gmsb:
    enabled: true
    description: GMSB_L-100TeV_Ctau-1000cm_TuneCP5_14TeV-pythia8
    role: signal
    truth: llp
    # Input conditions differ from the replay conditions above.
    das: /GMSB_L-100TeV_Ctau-1000cm_TuneCP5_14TeV-pythia8/Phase2Spring24DIGIRECOMiniAOD-PU200_Trk1GeV_140X_mcRun4_realistic_v4-v1/GEN-SIM-DIGI-RAW-MINIAOD
    files: []  # Explicit /store/... LFNs or root:// URLs can replace DAS.
    tier: GEN-SIM-DIGI-RAW-MINIAOD
    input_global_tag: 140X_mcRun4_realistic_v4
    instance: prod/global
  hgg:
    enabled: true
    description: GluGluHToGG_M-125_TuneCP5_14TeV-powheg-pythia8
    role: signal
    truth: prompt
    das: /GluGluHToGG_M-125_TuneCP5_14TeV-powheg-pythia8/Phase2Spring24DIGIRECOMiniAOD-PU200_Trk1GeV_140X_mcRun4_realistic_v4-v2/GEN-SIM-DIGI-RAW-MINIAOD
    files: []
    tier: GEN-SIM-DIGI-RAW-MINIAOD
    input_global_tag: 140X_mcRun4_realistic_v4
    instance: prod/global
  qcd_inclusive:
    enabled: true
    description: QCD_Pt-15To3000_TuneCP5_Flat_14TeV-pythia8
    role: background
    truth: all
    das: /QCD_Pt-15To3000_TuneCP5_Flat_14TeV-pythia8/Phase2Spring24DIGIRECOMiniAOD-PU200_Trk1GeV_140X_mcRun4_realistic_v4-v1/GEN-SIM-DIGI-RAW-MINIAOD
    files: []
    tier: GEN-SIM-DIGI-RAW-MINIAOD
    instance: prod/global
  qcd_em:
    enabled: true
    description: QCD_Pt-15To3000_EMEnriched_TuneCP5_14TeV-pythia8
    role: background
    truth: all
    das: /QCD_Pt-15To3000_EMEnriched_TuneCP5_14TeV-pythia8/Phase2Spring24DIGIRECOMiniAOD-PU200_Trk1GeV_140X_mcRun4_realistic_v4-v1/GEN-SIM-DIGI-RAW-MINIAOD
    files: []
    tier: GEN-SIM-DIGI-RAW-MINIAOD
    instance: prod/global
  qcd_bc:
    enabled: true
    description: QCD_Pt-30To80_bcToE_TuneCP5_14TeV-pythia8
    role: background
    truth: all
    das: /QCD_Pt-30To80_bcToE_TuneCP5_14TeV-pythia8/Phase2Spring24DIGIRECOMiniAOD-PU200_Trk1GeV_140X_mcRun4_realistic_v4-v1/GEN-SIM-DIGI-RAW-MINIAOD
    files: []
    tier: GEN-SIM-DIGI-RAW-MINIAOD
    instance: prod/global
